function showToast(msg, severity='success') {
  store.ui.toast = { msg, severity, ts: Date.now() }
  setTimeout(() => { store.ui.toast = null }, 3000)
}
function getGuestById(id) { return store.guests.find(g => g.id === id) }
function getStaffById(id) { return store.staff.find(s => s.id === id) }
function getGuestPairings(gid) { return store.pairings.filter(p => p.guestId === gid).map(p => ({...p, staff: getStaffById(p.staffId)})) }
function getGuestSchedule(gid) { return store.schedule.filter(e => e.guestId === gid).sort((a,b) => (a.date+a.startTime).localeCompare(b.date+b.startTime)) }
function getGuestPrep(gid) { return store.prep.filter(p => p.guestId === gid) }
function getGuestTravel(gid) { return store.travel.filter(t => t.guestId === gid) }
function getGuestAccom(gid) { return store.accommodations.filter(a => a.guestId === gid) }
function getGuestDietary(gid) { return store.dietary.filter(d => d.guestId === gid) }
function guestHasLiaison(gid) { return store.pairings.some(p => p.guestId === gid && p.role.includes('Liaison')) }
function guestPrepPercent(gid) {
  const items = getGuestPrep(gid)
  if (items.length === 0) return 0
  return Math.round((items.filter(i => i.status === 'Complete').length / items.length) * 100)
}
function guestStaffCount(gid) { return store.pairings.filter(p => p.guestId === gid).length }
function getGuestAutographs(gid) { return store.autographs.filter(a => a.guestId === gid) }

function formatDate(d) {
  if (!d) return ''
  try { return new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) } catch { return d }
}
function formatTime(t) {
  if (!t) return ''
  const [h,m] = t.split(':').map(Number)
  const ampm = h >= 12 ? 'PM' : 'AM'
  return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${ampm}`
}
function nextId(prefix) { return prefix + Date.now() }

          <h3 class="font-display font-semibold text-gray-900 mb-3">Guests by Status</h3>
          <div v-for="[s,c] in guestsByStatus" :key="s" class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
            <badge :label="s" :color="statusColor[s]" /> <span class="font-semibold text-gray-800">{{ c }}</span>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm border p-5">
          <h3 class="font-display font-semibold text-gray-900 mb-3">Events by Type</h3>
          <div v-for="[t,c] in eventsByType" :key="t" class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
            <span class="text-sm text-gray-600">{{ t }}</span> <span class="font-semibold text-gray-800">{{ c }}</span>
          </div>
        </div>
      </div>
    </div>
  `,
  setup() {
    const days = ['2026-04-03','2026-04-04','2026-04-05']
    const selectedDay = ref(days[0])
    const hours = Array.from({length:15},(_, i) => 8+i)
    const START_H = 8, END_H = 22, TOTAL_M = (END_H-START_H)*60
    const legend = [
      {type:'Panel',color:'bg-indigo-500'},{type:'Autograph',color:'bg-purple-500'},
      {type:'Photo Op',color:'bg-sky-500'},{type:'Meal',color:'bg-emerald-500'},
      {type:'Meet & Greet',color:'bg-pink-500'},{type:'Rehearsal',color:'bg-amber-500'},
    ]

    const confirmed = computed(() => store.guests.filter(g=>g.status==='Confirmed').length)
    const invited = computed(() => store.guests.filter(g=>g.status==='Invited').length)
    const prepComplete = computed(() => {
      const all = store.prep
      if(!all.length) return 0
      return Math.round(all.filter(p=>p.status==='Complete').length/all.length*100)
    })
    const overdue = computed(() => store.prep.filter(p=>p.status==='Overdue').length)
    const noLiaison = computed(() => store.guests.filter(g=>g.status!=='Cancelled'&&!guestHasLiaison(g.id)).length)

    const stats = computed(() => [
      { label:'Total Guests', value:store.guests.length, sub:confirmed.value+' confirmed, '+invited.value+' invited', borderColor:'border-l-ab-500' },
      { label:'Prep Complete', value:prepComplete.value+'%', sub:overdue.value+' overdue items', borderColor:'border-l-accent-400' },
      { label:'Staff Assigned', value:store.pairings.length, sub:store.staff.length+' total staff', borderColor:'border-l-ab-600' },
      { label:'Schedule Events', value:store.schedule.length, sub:'Across 3 days', borderColor:'border-l-emerald-400' },
    ])

    const alerts = computed(() => {
      const a = []
      if(noLiaison.value>0) a.push({key:'l',label:noLiaison.value+' guest(s) without liaison assigned',to:'/guests'})
      if(overdue.value>0) a.push({key:'p',label:overdue.value+' prep item(s) overdue',to:'/prep-tracker'})
      return a
    })

    const staffingRows = computed(() =>
      store.guests.filter(g=>g.status!=='Cancelled').map(g=>({
        guestId:g.id, name:g.name,
        hasLiaison:guestHasLiaison(g.id),
        needsInterpreter:g.interpreterRequired,
        hasInterpreter:store.pairings.some(p=>p.guestId===g.id&&p.role==='Interpreter'),
      })).filter(r=>!r.hasLiaison||(r.needsInterpreter&&!r.hasInterpreter)).slice(0,8)
    )

    const dayEvents = computed(() => store.schedule.filter(e=>e.date===selectedDay.value))
    const timelineRows = computed(() => {
      const evs = dayEvents.value.map(e => {
        const [sh,sm] = e.startTime.split(':').map(Number)
        const [eh,em] = e.endTime.split(':').map(Number)
        const startM = sh*60+sm - START_H*60
        const endM = eh*60+em - START_H*60
        return {...e, left: Math.max(0,startM/TOTAL_M*100), width: Math.max(0,(endM-startM)/TOTAL_M*100), startM, endM }
      }).sort((a,b)=>a.startM-b.startM)
      const rows = []
      for(const ev of evs) {
        const row = rows.find(r=>r.every(p=>p.endM<=ev.startM||ev.endM<=p.startM))
        if(row) row.push(ev); else rows.push([ev])
      }
      return rows
    })

    const guestsByStatus = computed(() => {
      const m = {}; store.guests.forEach(g=>{m[g.status]=(m[g.status]||0)+1}); return Object.entries(m)
    })
    const eventsByType = computed(() => {
      const m = {}; store.schedule.forEach(e=>{m[e.eventType]=(m[e.eventType]||0)+1}); return Object.entries(m).sort((a,b)=>b[1]-a[1])
    })

    function formatHour(h) { return h===12?'12pm':h<12?h+'am':(h-12)+'pm' }

    return { store, stats, alerts, staffingRows, days, selectedDay, hours, dayEvents, timelineRows, legend, guestsByStatus, eventsByType, formatDate, formatHour, statusColor, eventTypeColor, getGuestById }
  }
}

  setup() {
    const route = useRoute()
    const activeTab = ref('info')
    const tabs = [
      {key:'info',label:'Info',icon:'pi pi-user'},
      {key:'schedule',label:'Schedule',icon:'pi pi-calendar'},
      {key:'travel',label:'Travel',icon:'pi pi-send'},
      {key:'hotel',label:'Hotel',icon:'pi pi-building'},
      {key:'dietary',label:'Dietary',icon:'pi pi-heart'},
      {key:'prep',label:'Prep',icon:'pi pi-check-square'},
      {key:'staff',label:'Staff',icon:'pi pi-users'},
      {key:'autographs',label:'Autographs',icon:'pi pi-pencil'},
    ]
    const guest = computed(() => getGuestById(route.params.id))
    const guestEvents = computed(() => guest.value ? getGuestSchedule(guest.value.id) : [])
    const guestTravelRec = computed(() => guest.value ? getGuestTravel(guest.value.id) : [])
    const guestAccomRec = computed(() => guest.value ? getGuestAccom(guest.value.id) : [])
    const guestDietaryRec = computed(() => guest.value ? getGuestDietary(guest.value.id) : [])
    const guestPrepItems = computed(() => guest.value ? getGuestPrep(guest.value.id) : [])
    const guestPairingsRec = computed(() => guest.value ? getGuestPairings(guest.value.id) : [])
    const pp = computed(() => guest.value ? guestPrepPercent(guest.value.id) : 0)

    const guestAutoRec = computed(() => guest.value ? getGuestAutographs(guest.value.id) : [])
    const assignStaffId = ref('')
    const assignRole = ref('Main Liaison')
    const availableStaff = computed(() => store.staff.filter(s => !store.pairings.some(p => p.guestId === guest.value?.id && p.staffId === s.id)))

    function tabCount(key) {
      const c = {schedule:guestEvents.value.length, travel:guestTravelRec.value.length, hotel:guestAccomRec.value.length, dietary:guestDietaryRec.value.length, prep:guestPrepItems.value.length, staff:guestPairingsRec.value.length, autographs:guestAutoRec.value.length}
      return c[key] || null
    }
    function togglePrep(p) {
      p.status = p.status === 'Complete' ? 'Not Started' : 'Complete'
      p.completedAt = p.status === 'Complete' ? new Date().toISOString().slice(0,10) : undefined
      showToast(p.status === 'Complete' ? 'Marked complete' : 'Unmarked')
    }
    function doAssignStaff() {
      if (!assignStaffId.value || !guest.value) return
      store.pairings.push({id:nextId('p'), guestId:guest.value.id, staffId:assignStaffId.value, role:assignRole.value})
      showToast('Staff assigned'); assignStaffId.value = ''
    }
    function removeStaff(pid) {
      const i = store.pairings.findIndex(p => p.id === pid)
      if (i >= 0) { store.pairings.splice(i, 1); showToast('Staff removed') }
    }
    const showItinerary = ref(false)
    const showChecklist = ref(false)
    function generateItinerary() { showItinerary.value = true }
    function generateChecklist() { showChecklist.value = true }
    function printItinerary() { window.print() }
    const groupedSchedule = computed(() => {
      const groups = {}
      guestEvents.value.forEach(ev => {
        if (!groups[ev.date]) groups[ev.date] = []
        groups[ev.date].push(ev)
      })
      const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December']
      return Object.keys(groups).sort().map(date => {
        const d = new Date(date + 'T12:00:00')
        const label = dayNames[d.getDay()] + ', ' + monthNames[d.getMonth()] + ' ' + d.getDate()
        return { date, label, events: groups[date] }
      })
    })

    return { guest, activeTab, tabs, guestEvents, guestTravelRec, guestAccomRec, guestDietaryRec, guestPrepItems, guestPairingsRec, guestAutoRec, pp, togglePrep, assignStaffId, assignRole, availableStaff, doAssignStaff, removeStaff, generateItinerary, generateChecklist, printItinerary, showItinerary, showChecklist, groupedSchedule, tabCount, statusColor, typeColor, prepStatusColor, eventTypeColor, formatDate, formatTime }
  }
}

        </div>
        <div v-for="(row,ri) in tlRows" :key="ri" class="relative h-8 mb-1.5">
          <div v-for="ev in row" :key="ev.id" :class="['absolute top-0 h-full rounded px-1.5 flex items-center overflow-hidden cursor-pointer', eventTypeColor[ev.eventType]||'bg-gray-400']" :style="{left:ev.left+'%',width:Math.max(ev.width,2.5)+'%'}" :title="ev.activity+' — '+(getGuestById(ev.guestId)||{}).name" @click="$router.push('/guests/'+ev.guestId)">
            <span class="text-[10px] font-semibold text-white truncate">{{ ev.activity }}</span>
          </div>
        </div>
        <div v-if="filteredEvents.length===0" class="text-center py-8 text-gray-400">No events match your filters</div>

          <span v-for="l in legend" :key="l.t" class="flex items-center gap-1.5 text-[10px] font-semibold uppercase tracking-wider text-gray-500"><span :class="['w-2.5 h-2.5 rounded-sm', l.c]" />{{ l.t }}</span>
        </div>
      </div>
    </div>

  setup() {
    const days = ['2026-04-03','2026-04-04','2026-04-05']
    const selectedDay = ref(days[0])
    const viewMode = ref('table')
    const filterGuest = ref('')
    const filterVenue = ref('')
    const filterType = ref('')
    const hours = Array.from({length:15},(_,i)=>8+i)
    const SH=8,EH=22,TM=(EH-SH)*60
    const legend = [{t:'Panel',c:'bg-indigo-500'},{t:'Autograph',c:'bg-purple-500'},{t:'Photo Op',c:'bg-sky-500'},{t:'Meal',c:'bg-emerald-500'},{t:'Meet & Greet',c:'bg-pink-500'},{t:'Rehearsal',c:'bg-amber-500'}]

    const dayEvents = computed(() => store.schedule.filter(e=>e.date===selectedDay.value).sort((a,b)=>a.startTime.localeCompare(b.startTime)))
    const filteredEvents = computed(() => dayEvents.value.filter(e => {
      if(filterGuest.value && e.guestId!==filterGuest.value) return false
      if(filterVenue.value && e.venue!==filterVenue.value) return false
      if(filterType.value && e.eventType!==filterType.value) return false
      return true
    }))
    const tlRows = computed(() => {
      const evs = filteredEvents.value.map(e => {
        const [sh,sm]=e.startTime.split(':').map(Number)
        const [eh,em]=e.endTime.split(':').map(Number)
        const startM=sh*60+sm-SH*60, endM=eh*60+em-SH*60
        return {...e, left:Math.max(0,startM/TM*100), width:Math.max(0,(endM-startM)/TM*100), startM, endM}
      }).sort((a,b)=>a.startM-b.startM)
      const rows=[]
      for(const ev of evs){const row=rows.find(r=>r.every(p=>p.endM<=ev.startM||ev.endM<=p.startM));if(row)row.push(ev);else rows.push([ev])}
      return rows
    })
    function fmtHour(h){return h===12?'12pm':h<12?h+'am':(h-12)+'pm'}

    return { store, days, selectedDay, viewMode, filterGuest, filterVenue, filterType, filteredEvents, hours, tlRows, legend, fmtHour, formatDate, formatTime, statusColor, eventTypeColor, getGuestById }
  }
}

            <option v-for="o in uniqueOwners" :key="o" :value="o">{{ o }}</option>
          </select>
          <select v-model="filterStatus" class="border rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-ab-300 outline-none">
            <option value="">All Statuses</option>
            <option v-for="s in statusOptions" :key="s" :value="s">{{ s }}</option>
          </select>
        </div>
        <div class="flex items-center justify-between text-xs text-gray-500">
          <span>Showing <strong class="text-gray-700">{{ filteredCount }}</strong> of {{ store.prep.length }} items</span>
          <button v-if="hasActiveFilters" class="text-ab-600 hover:text-ab-800 font-semibold" @click="clearFilters">Clear filters</button>
        </div>
      </div>
      <!-- Items grouped by guest -->
      <div v-for="group in groupedPrep" :key="group.guestId" class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <div class="px-5 py-3 bg-gray-50 border-b flex items-center justify-between cursor-pointer" @click="$router.push('/guests/'+group.guestId)">
          <div class="flex items-center gap-2">

            <span class="text-xs font-semibold text-gray-600">{{ group.percent }}%</span>
          </div>
        </div>
        <div class="divide-y divide-gray-50">
          <div v-for="p in group.items" :key="p.id" class="flex items-center gap-3 px-5 py-2.5">
            <button :class="['w-5 h-5 rounded border-2 flex items-center justify-center transition-all shrink-0', p.status==='Complete'?'bg-emerald-500 border-emerald-500 text-white':'border-gray-300 hover:border-ab-400']" @click="togglePrep(p)">
              <i v-if="p.status==='Complete'" class="pi pi-check text-[10px]" />
            </button>
            <span :class="['flex-1 text-sm', p.status==='Complete'?'text-gray-400 line-through':'text-gray-900']">{{ p.item }}</span>
            <badge :label="p.status" :color="prepStatusColor[p.status]" />
            <span class="text-xs text-gray-400 hidden sm:inline">{{ p.owner }} · Due {{ formatDate(p.dueDate) }}</span>
          </div>
        </div>
      </div>
    </div>
  `,
  setup() {
    const searchText = ref('')
    const filterGuest = ref('')
    const filterOwner = ref('')
    const filterStatus = ref('')
    const statusOptions = ['Complete','In Progress','Not Started','Overdue']

    const uniqueOwners = computed(() => {
      const owners = new Set(store.prep.map(p => p.owner))
      return [...owners].sort()
    })

    const overallPercent = computed(() => {
      const all = store.prep
      if (!all.length) return 0
      return Math.round(all.filter(p => p.status === 'Complete').length / all.length * 100)
    })

    const summaryStats = computed(() => {
      const all = store.prep
      const complete = all.filter(p=>p.status==='Complete').length
      const overdue = all.filter(p=>p.status==='Overdue').length
      return [
        {label:'Total Items',value:all.length,border:'border-l-ab-500'},
        {label:'Complete',value:complete,border:'border-l-emerald-400'},
        {label:'In Progress',value:all.filter(p=>p.status==='In Progress').length,border:'border-l-amber-400'},
        {label:'Overdue',value:overdue,border:'border-l-red-400'},
      ]
    })

    const filteredItems = computed(() => {
      const search = searchText.value.toLowerCase().trim()
      return store.prep.filter(p => {
        if (filterStatus.value && p.status !== filterStatus.value) return false
        if (filterGuest.value && p.guestId !== filterGuest.value) return false
        if (filterOwner.value && p.owner !== filterOwner.value) return false
        if (search && !p.item.toLowerCase().includes(search) && !p.owner.toLowerCase().includes(search)) return false
        return true
      })
    })

    const filteredCount = computed(() => filteredItems.value.length)

    const hasActiveFilters = computed(() => !!(searchText.value || filterGuest.value || filterOwner.value || filterStatus.value))

    function clearFilters() {
      searchText.value = ''
      filterGuest.value = ''
      filterOwner.value = ''
      filterStatus.value = ''
    }

    const groupedPrep = computed(() => {
      const groups = {}
      filteredItems.value.forEach(p => {
        if(!groups[p.guestId]) {
          const g = getGuestById(p.guestId)
          groups[p.guestId] = { guestId:p.guestId, guestName:g?.name||'Unknown', guestType:g?.type||'', items:[], percent:0 }
        }
        groups[p.guestId].items.push(p)
      })
      return Object.values(groups).map(g => {
        const allForGuest = store.prep.filter(p=>p.guestId===g.guestId)
        g.percent = allForGuest.length ? Math.round(allForGuest.filter(p=>p.status==='Complete').length/allForGuest.length*100) : 0
        return g
      })
    })

    function togglePrep(p) {
      p.status = p.status === 'Complete' ? 'Not Started' : 'Complete'
      p.completedAt = p.status === 'Complete' ? new Date().toISOString().slice(0,10) : undefined
      showToast(p.status === 'Complete' ? 'Marked complete' : 'Unmarked')
    }

    return { store, searchText, filterGuest, filterOwner, filterStatus, statusOptions, uniqueOwners, overallPercent, summaryStats, filteredCount, hasActiveFilters, clearFilters, groupedPrep, togglePrep, typeColor, prepStatusColor, formatDate }
  }
}

                    class="text-gray-400 hover:text-gray-600 transition-colors" title="Cancel">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>

                  class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold bg-accent-400/10 text-accent-600 border border-accent-300 hover:bg-accent-400/20 transition-colors cursor-pointer">

            <thead>
              <tr class="text-left text-gray-500 border-b border-gray-100">

                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `,
  setup() {
    const editing = ref(false)
    const editForm = reactive({
      name: store.config.convention.name,
      venue: store.config.convention.venue,
      startDate: store.config.convention.startDate,
      endDate: store.config.convention.endDate,
    })
    const addingSection = ref(null)
    const newItemText = ref('')

    const daysUntil = computed(() => {
      const start = new Date(store.config.convention.startDate + 'T00:00:00')
      const now = new Date()
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate())
      return Math.ceil((start - today) / (1000 * 60 * 60 * 24))
    })

    const sections = computed(() => [
      { label: 'Departments', key: 'departments', singular: 'department', items: store.config.departments },
      { label: 'Staff Roles', key: 'roles', singular: 'role', items: store.config.roles },
      { label: 'Event Types', key: 'eventTypes', singular: 'event type', items: store.config.eventTypes },
      { label: 'Venues', key: 'venues', singular: 'venue', items: store.config.venues },
    ])

    function toggleEdit() {
      if (editing.value) {
        cancelEdit()
      } else {
        editForm.name = store.config.convention.name
        editForm.venue = store.config.convention.venue
        editForm.startDate = store.config.convention.startDate
        editForm.endDate = store.config.convention.endDate
        editing.value = true
      }
    }

    function saveConventionInfo() {
      store.config.convention.name = editForm.name
      store.config.convention.venue = editForm.venue
      store.config.convention.startDate = editForm.startDate
      store.config.convention.endDate = editForm.endDate
      editing.value = false
      showToast('Convention info updated')
    }

    function cancelEdit() {
      editForm.name = store.config.convention.name
      editForm.venue = store.config.convention.venue
      editForm.startDate = store.config.convention.startDate
      editForm.endDate = store.config.convention.endDate
      editing.value = false
    }

    function confirmAddItem(key) {
      const text = newItemText.value.trim()
      if (!text) return
      if (store.config[key].includes(text)) {
        showToast('Item already exists', 'warn')
        return
      }
      store.config[key].push(text)
      newItemText.value = ''
      addingSection.value = null
      showToast('Added to ' + key)
    }

    function removeConfigItem(key, idx) {
      const removed = store.config[key][idx]
      store.config[key].splice(idx, 1)
      showToast('Removed "' + removed + '"')
    }

    return {
      store, editing, editForm, addingSection, newItemText,
      daysUntil, sections, formatDate,
      toggleEdit, saveConventionInfo, cancelEdit, confirmAddItem, removeConfigItem
    }
  }
}

          departureDate: form.travel.departureDate,
          departureTime: '',
          arrivalDate: form.travel.arrivalDate,
          arrivalTime: '',
          confirmation: '',
          status: 'Pending',
        })
      }

      if (hasAccomData.value) {
        store.accommodations.push({
          id: nextId('a'),
          guestId,
          hotel: form.accommodation.hotel.trim(),
          roomType: form.accommodation.roomType.trim(),
          checkIn: form.accommodation.checkIn,
          checkOut: form.accommodation.checkOut,
          confirmation: '',
          specialRequests: '',
          status: 'Pending',
        })
      }

      if (hasDietaryData.value) {
        store.dietary.push({
          id: nextId('d'),
          guestId,
          type: form.dietary.type.trim(),
          restrictions: parseCommaList(form.dietary.restrictionsStr),
          allergies: parseCommaList(form.dietary.allergiesStr),
          preferences: parseCommaList(form.dietary.preferencesStr),
          notes: '',
        })
      }

      showToast('Guest "' + newGuest.name + '" created successfully!')
      router.push('/guests/' + guestId)
    }

    return { store, currentStep, stepLabels, form, canProceed, hasTravelData, hasAccomData, hasDietaryData, submitGuest }
  }
}

// ═══════════════════════════════════════════════════════════════
//  ROUTER
// ═══════════════════════════════════════════════════════════════

const routes = [
  {
    path: '/',
    component: AppLayout,
    children: [
      { path: '', redirect: '/dashboard' },
      { path: 'dashboard', component: DashboardView },
      { path: 'guests', component: GuestListView },
      { path: 'guests/:id', component: GuestHubView },
      { path: 'staff', component: StaffListView },
      { path: 'schedule', component: ScheduleView },
      { path: 'prep-tracker', component: PrepTrackerView },
      { path: 'settings', component: SettingsView },
      { path: 'wizard', component: NewGuestWizardView },
    ],
  },
]

const router = createRouter({
  history: createWebHashHistory(),
  routes,
})

// ═══════════════════════════════════════════════════════════════
//  APP
// ═══════════════════════════════════════════════════════════════

const app = createApp({
  template: '<router-view />'
})

app.component('badge', Badge)
app.component('toast-notif', ToastNotif)
app.use(router)
app.mount('#app')
</script>
